name: Docker Build

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/paperclip

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        target: [ production, cloud ]
        include:
          - target: production
            tag-suffix: ""
          - target: cloud
            tag-suffix: "-cloud"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git-based versioning

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine build version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${{ github.sha }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=${{ matrix.tag-suffix }}
            type=semver,pattern={{version}},suffix=${{ matrix.tag-suffix }}
            type=sha,prefix={{branch}}-,suffix=${{ matrix.tag-suffix }}

      - name: Build and push ${{ matrix.target }} image
        uses: docker/build-push-action@v5
        with:
          context: paperclip
          target: ${{ matrix.target }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PAPERCLIP_BUILD_VERSION=${{ steps.version.outputs.version }}
            PAPERCLIP_BUILD_COMMIT=${{ github.sha }}
            CLI_TOOLS_CACHE_EPOCH=${{ github.run_id }}
            CLOUD_BUNDLED_PLUGINS=daytona
            CLOUD_BUNDLED_SERVER_DEPS=@sentry/node
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Test production build (PR only)
        if: github.event_name == 'pull_request' && matrix.target == 'production'
        run: |
          docker build --target production \
            --build-arg PAPERCLIP_BUILD_VERSION=test \
            --build-arg PAPERCLIP_BUILD_COMMIT=${{ github.sha }} \
            -t paperclip:test \
            ./paperclip
          docker run --rm paperclip:test node --version

  build-health-check:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Verify image pushed
        run: |
          echo "Production and cloud images built and pushed successfully"
